<title>Редактирование профиля</title>

<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  body {
    background: #f8f9fa;
  }
  .profile-form {
    background: #fff;
    padding: 30px 40px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.1);
  }
  .profile-form h2 {
    margin-bottom: 30px;
    font-weight: 700;
    color: #343a40;
    letter-spacing: 0.05em;
  }
  .form-label {
    font-weight: 600;
    color: #495057;
  }
  .form-control:focus {
    border-color: #0d6efd;
    box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
  }
  .btn-primary {
    background: linear-gradient(135deg, #4e73df, #224abe);
    border: none;
    font-weight: 600;
    padding: 12px 30px;
    border-radius: 50px;
    transition: background 0.3s ease;
  }
  .btn-primary:hover {
    background: linear-gradient(135deg, #224abe, #4e73df);
  }
</style>

<div class="container mt-5 d-flex justify-content-center">
  <div class="col-md-7 col-lg-6 profile-form">
    <h2>Редактировать профиль</h2>

    <form method="post" enctype="multipart/form-data" class="row g-4">
      {% csrf_token %}

      <div class="col-md-6">
        <label for="id_first_name" class="form-label">Имя</label>
        <input type="text" class="form-control" id="id_first_name" name="first_name" value="{{ user.first_name|default:'' }}">
      </div>

      <div class="col-md-6">
        <label for="id_last_name" class="form-label">Фамилия</label>
        <input type="text" class="form-control" id="id_last_name" name="last_name" value="{{ user.last_name|default:'' }}">
      </div>

      <div class="col-12">
        <label for="id_middle_name" class="form-label">Отчество</label>
        <input type="text" class="form-control" id="id_middle_name" name="middle_name" value="{{ user.middle_name|default:'' }}">
      </div>

      <div class="col-12">
        <label for="id_position" class="form-label">Должность</label>
        <input type="text" class="form-control" id="id_position" name="position" value="{{ user.position|default:'' }}">
      </div>

      <div class="col-md-6">
        <label for="id_email" class="form-label">Почта</label>
        <input type="email" class="form-control" id="id_email" name="email" value="{{ user.email|default:'' }}">
      </div>

      <div class="col-md-6">
        <label for="id_phone" class="form-label">Телефон</label>
        <input type="tel" class="form-control" id="id_phone" name="phone" value="{{ user.phone|default:'' }}">
      </div>

      <div class="col-12">
        <label for="id_image" class="form-label">Фото профиля</label>
        <input type="file" class="form-control" id="id_image" name="image">
      </div>

      <div class="col-12 text-center">
        <button type="submit" class="btn btn-primary px-5">Сохранить</button>
      </div>
    </form>
  </div>
</div>
